<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Carte du monde</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,650&family=Outfit:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app">
      <div id="map"></div>
      <header class="toolbar">
        <p class="brand">Monde</p>
        <div class="modes" role="group" aria-label="Mode d’affichage">
          <button type="button" id="mode-globe" aria-pressed="true">Globe</button>
          <button type="button" id="mode-map" aria-pressed="false">Carte</button>
        </div>
        <div class="search">
          <label class="sr-only" for="country-search">Rechercher un pays</label>
          <input
            id="country-search"
            type="search"
            placeholder="Rechercher un pays"
            autocomplete="off"
            role="combobox"
            aria-expanded="false"
            aria-controls="search-results"
            aria-autocomplete="list"
          />
          <ul id="search-results" role="listbox" hidden></ul>
        </div>
      </header>
      <aside id="panel" class="panel" hidden aria-labelledby="panel-title">
        <div class="panel-bar">
          <button type="button" id="panel-close" aria-label="Fermer la fiche">×</button>
        </div>
        <div id="panel-body" aria-live="polite"></div>
      </aside>
      <div id="boot" class="boot" role="status">Chargement de la carte…</div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
