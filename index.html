<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Carte du monde</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,650&family=Outfit:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="mode-globe">
    <div id="app">
      <div id="map"></div>
      <header class="toolbar">
        <p class="brand">Monde</p>
        <button type="button" id="mode-toggle" class="mode-toggle" aria-label="Afficher la carte" title="Afficher la carte">
          <svg class="icon-map" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 4.5 3.5 6.2v13.3L9 17.8l6 1.7 5.5-1.7V4.5L15 6.2 9 4.5Z" />
            <path d="M9 4.5v13.3M15 6.2v13.3" />
          </svg>
          <svg class="icon-globe" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="8.25" />
            <ellipse cx="12" cy="12" rx="3.6" ry="8.25" />
            <path d="M3.75 12h16.5M5.4 7.6h13.2M5.4 16.4h13.2" />
          </svg>
        </button>
        <div class="search">
          <label class="sr-only" for="country-search">Rechercher un pays</label>
          <input
            id="country-search"
            type="search"
            placeholder="Rechercher un pays"
            autocomplete="off"
            role="combobox"
            aria-expanded="false"
            aria-controls="search-results"
            aria-autocomplete="list"
          />
          <ul id="search-results" role="listbox" hidden></ul>
        </div>
      </header>
      <aside id="panel" class="panel" hidden aria-labelledby="panel-title">
        <div class="panel-bar">
          <button type="button" id="panel-close" aria-label="Fermer la fiche">×</button>
        </div>
        <div id="panel-body" aria-live="polite"></div>
      </aside>
      <div id="boot" class="boot" role="status">Chargement de la carte…</div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
